# Version updates, held back 20 days after release (supply-chain cooldown).
# Security updates are unaffected: GitHub never applies cooldown to them, so
# they arrive as soon as a fix exists and are reviewed as flagged exceptions.
#
# Minor and patch bumps share one PR per ecosystem, so the verify job sees them
# together instead of failing single-package PRs while the others are pending.
# Majors arrive as their own PRs: each one is a decision, not routine upkeep.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 20
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # v4 drops the CLI the build scripts call; it is a migration, not a bump.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /photography/utils
    schedule:
      interval: weekly
    cooldown:
      default-days: 20
    groups:
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 20
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
