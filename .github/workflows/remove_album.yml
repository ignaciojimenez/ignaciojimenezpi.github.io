name: Remove Album

on:
  workflow_dispatch:
    inputs:
      album_id:
        description: 'Album ID to remove'
        required: true
        type: string
  repository_dispatch:
    types: [remove_album]

jobs:
  remove-album:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f photography/utils/requirements.txt ]; then pip install -r photography/utils/requirements.txt; fi
        # Ensure Pillow is installed if not in requirements (needed for AlbumManager imports)
        pip install Pillow
        
    - name: Remove Album
      env:
        WORKFLOW_DISPATCH_ALBUM_ID: ${{ github.event.inputs.album_id }}
        REPOSITORY_DISPATCH_ALBUM_ID: ${{ github.event.client_payload.album_id }}
      run: |
        cd photography/utils
        # Get album_id from workflow_dispatch input or repository_dispatch payload
        ALBUM_ID="$WORKFLOW_DISPATCH_ALBUM_ID"
        if [ -z "$ALBUM_ID" ]; then
          ALBUM_ID="$REPOSITORY_DISPATCH_ALBUM_ID"
        fi
        
        if [ -z "$ALBUM_ID" ]; then
          echo "Error: No album_id provided"
          exit 1
        fi
        
        echo "Removing album: $ALBUM_ID"
        python album.py delete --album-name "$ALBUM_ID" --yes
        
    - name: Commit and push changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WORKFLOW_DISPATCH_ALBUM_ID: ${{ github.event.inputs.album_id }}
        REPOSITORY_DISPATCH_ALBUM_ID: ${{ github.event.client_payload.album_id }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          # Album id goes through the environment, never interpolated into the
          # shell, so a crafted id cannot inject commands.
          ALBUM_ID="${WORKFLOW_DISPATCH_ALBUM_ID:-$REPOSITORY_DISPATCH_ALBUM_ID}"
          git commit -m "Remove album: ${ALBUM_ID}"
          # Credentials are not persisted in .git/config (persist-credentials: false),
          # so the token is supplied only for this push and never exposed to the
          # earlier steps or the actions they run.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
        fi
