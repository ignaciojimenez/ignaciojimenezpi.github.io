name: Process Staged Albums

on:
  push:
    paths:
      - 'photography/staging/**/metadata.json'
    branches:
      - master
      - main
      - feature/mobile-album-creation

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  process-album:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f photography/utils/requirements.txt ]; then pip install -r photography/utils/requirements.txt; fi
        # Ensure Pillow is installed if not in requirements
        pip install Pillow
        
    - name: Process Staged Albums
      run: |
        cd photography/utils
        python process_staging.py
        
    - name: Commit and push changes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add -A
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Process staged albums"
          # Credentials are not persisted in .git/config (persist-credentials: false),
          # so the token is supplied only for this push and never exposed to the
          # earlier steps or the actions they run.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
        fi
